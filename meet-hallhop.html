<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HallHop – Meet HallHop</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .iframe-wrapper iframe {
      position: absolute;
      top: -30px;
      left: 0;
      width: 100%;
      height: calc(100% + 30px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <iframe id="hallhopFrame" src="https://varunnagaraj2009.wixstudio.com/hallhop/meet-hallhop" allowfullscreen></iframe>
  </div>

  <script>
    window.addEventListener('message', (event) => {
      if (!event.data || typeof event.data !== 'object') return;

      const { type, page } = event.data;

      if (type === 'navigate' && typeof page === 'string') {
        console.log('Redirecting iframe to:', page);

        // Set new iframe source based on received page
        const iframe = document.getElementById('hallhopFrame');
        iframe.src = `https://varunnagaraj2009.wixstudio.com/hallhop/${page}`;
      }
    });
  </script>
</body>
</html>
